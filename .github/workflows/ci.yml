name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  comment-hygiene:
    name: comment hygiene (added lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { fetch-depth: 0 }
      - name: Require no change-narration comments (apply 'skip-comment-check' label to bypass)
        env:
          {
            BASE_REF: "${{ github.base_ref }}",
            LABELS: "${{ join(github.event.pull_request.labels.*.name, ' ') }}",
          }
        run: |
          patterns=".claude/comment-hygiene-patterns.txt"
          base="origin/$BASE_REF"
          git rev-parse --verify -q "$base^{commit}" >/dev/null || { echo "::error::$base not found (check out with full history, fetch-depth 0)"; exit 1; }
          [ -f "$patterns" ] || { echo "::error::comment-hygiene pattern list missing (.claude/comment-hygiene-patterns.txt)"; exit 1; }
          strict_patterns=$(mktemp)
          head -n 10 "$patterns" > "$strict_patterns"
          nl=$(printf '\nx'); nl=${nl%x}
          flagged=""
          for f in $(git diff --name-only "$base"...HEAD); do
            case "$f" in *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs) ;; *) continue ;; esac
            [ -f "$f" ] || continue
            while IFS= read -r content; do
              stripped=$(printf '%s' "$content" | sed -E 's@^[[:space:]]*(#|//|\*|/\*\*?)[[:space:]]?@@')
              if [ -n "$stripped" ] && printf '%s' "$stripped" | grep -qEf "$strict_patterns"; then
                flagged="$flagged$nl  - $f: $stripped"
              fi
            done < <(git diff -U0 "$base"...HEAD -- "$f" | grep '^+' | grep -vE '^\+\+\+' | sed 's/^+//' | grep -E '^[[:space:]]*(#|//|\*|/\*\*?)')
          done
          rm -f "$strict_patterns"
          if [ -n "$flagged" ]; then
            echo " $LABELS " | grep -q ' skip-comment-check ' && { echo "skip-comment-check label present — OK"; exit 0; }
            echo "::error::Change-narration comments found (see list below)"
            printf '%s\n' "$flagged"
            echo "State WHAT the code does now, not what changed, or apply the 'skip-comment-check' label to bypass."
            exit 1
          fi

  test:
    name: check + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage

  e2e:
    name: e2e (public smoke)
    runs-on: ubuntu-latest
    env:
      # Boots the app with dummy Supabase values; no live database is needed.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      SUPABASE_SECRET_KEY: sb_secret_ci_dummy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/auth-guard.spec.ts e2e/smoke.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-order:
    name: e2e (order lifecycle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Boot the real stack (applies every migration) and load the coffee-cart
      # seed the order specs depend on (the "Kopitiam Cart" booth + its
      # short_code e2eKopitiam01). psql ships on ubuntu-latest.
      - run: supabase start
      # The coffee-cart seed reuses a dev "Test" vendor (vendors.id → auth.users)
      # that a fresh CI DB lacks — bootstrap that auth user + vendor first, then
      # seed the booth. ON_ERROR_STOP so a broken seed fails the job loudly.
      - name: Seed CI auth bootstrap + coffee-cart
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/seed/ci-auth-bootstrap.sql
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/seed/coffee-cart.sql
      # Hand the app the live local creds under the names it reads. The
      # override-name form writes KEY=value lines straight to the job env.
      - name: Export local Supabase creds for the app
        # `status -o env` emits KEY="value"; $GITHUB_ENV keeps quotes literally,
        # which made the app read a quoted (invalid) supabaseUrl. Strip the
        # surrounding quotes so the values land clean.
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SECRET_KEY \
            | sed -E 's/^([A-Z_]+)="?(.*[^"])"?$/\1=\2/' \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY|SUPABASE_SECRET_KEY)=' \
            >> "$GITHUB_ENV"
      # Playwright's webServer boots `pnpm dev`, which inherits the env above.
      - run: pnpm exec playwright test e2e/customer-order.spec.ts e2e/order-code.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-order
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: supabase stop

  db:
    name: db (migrations + pgTAP RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.0
      # `supabase start` boots the local stack and applies every migration in
      # supabase/migrations — so a malformed migration fails here. `test db` then
      # runs the pgTAP suite (supabase/tests/rls.test.sql), which carries its own
      # inline fixtures, so no seed or API keys are needed.
      - run: supabase start
      - run: supabase test db
      - if: always()
        run: supabase stop

  build:
    name: build (next build)
    runs-on: ubuntu-latest
    env:
      # next build renders dynamic routes at request time, so real Supabase
      # creds aren't needed — dummy values satisfy the non-null env reads.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      SUPABASE_SECRET_KEY: sb_secret_ci_dummy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  mutation:
    name: mutation (changed lib)
    runs-on: ubuntu-latest
    # PRs only, scoped to the src/lib files the PR touches. Advisory: the
    # Stryker config sets break=null, so a low score never fails the check.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mutation-test changed src/lib files
        run: |
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          # --diff-filter=d drops deleted paths: a PR that only removes a
          # src/lib file (e.g. code promoted into @merqo/ui along with its
          # tests) would otherwise hand Stryker a path that no longer
          # exists, and it exits 1 with "No tests were executed".
          CHANGED=$(git diff --name-only --diff-filter=d "origin/$GITHUB_BASE_REF...HEAD")
          FILES=$(printf '%s\n' "$CHANGED" | awk '
            /^src\/lib\/.*\.ts$/ && !/\.test\.ts$|\/types\.ts$|\/action-result\.ts$/ {
              printf "%s%s", separator, $0
              separator = ","
            }')
          if [ -z "$FILES" ]; then
            echo "No surviving src/lib changes — skipping mutation."
            exit 0
          fi
          echo "Mutating: $FILES"
          pnpm exec stryker run --mutate "$FILES"
